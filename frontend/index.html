<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PredictMed</title>
<style>
:root{--bg:#eef6f4;--card:#fff;--ink:#1f2d2b;--mut:#5b6b72;--line:#cfe3df;--teal:#0f6b63;--hi:#e36414}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Calibri,system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1,h2,h3{font-family:Cambria,Georgia,serif;color:var(--teal);margin:0}h1{font-size:24px}h3{font-size:18px;margin:14px 0 4px}
main{display:grid;grid-template-columns:320px 1fr;gap:16px;max-width:1150px;margin:16px auto;padding:0 16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.row.on{border-color:var(--teal);background:#e3f2ef}.t-High{color:var(--hi);font-weight:700}.t-Medium{color:var(--teal);font-weight:700}
.mut{color:var(--mut);font-size:14px}button{font:inherit;border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:8px;padding:5px 12px;cursor:pointer;margin:2px}
button.go{background:var(--teal);color:#fff}textarea{width:100%;min-height:90px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px}
.bar{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:14px}.bar i{display:block;height:9px;border-radius:5px;background:var(--hi)}.bar i.n{background:#2a9d8f}
.q{border-left:4px solid #2a9d8f;padding:4px 10px;background:var(--bg);margin:6px 0}svg{width:100%;height:auto}svg text{font-size:11px;fill:#5b6b72}
@media(max-width:820px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>PredictMed</h1><span class="mut" id="status">connecting...</span></header>
<main><aside><div class="p"><h2>Ranked outreach list</h2><div id="list" style="margin-top:10px"></div></div>
<div class="p" style="margin-top:16px"><h2>Drift watch</h2><div id="drift" class="mut">loading</div></div></aside>
<section class="p" id="detail">Select a member.</section></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,body)=>{const o=body===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};const r=await fetch("/api"+p,o);if(!r.ok)throw new Error(await r.text());return r.json()};
let cur=null,lang="en";
async function boot(){const h=await fetch("/api/health").then(r=>r.json());
 $("status").textContent=`model: ${h.model} v${h.model_version} | RAG: ${h.rag} | Groq: ${h.groq?"on":"off"} | local LLM: ${h.local_llm||"off"}`;await list();await drift()}
async function list(){const L=await api("/members");$("list").innerHTML=L.map(m=>`<button class="row ${cur===m.id?"on":""}" data-id="${m.id}"><b>${esc(m.name)}</b><span class="t-${m.tier}">${m.tier} ${Math.round(m.risk*100)}%</span><span class="mut" style="width:100%">eGFR ${Math.round(m.last)}, ${m.stage}, DVI ${m.dvi}</span></button>`).join("")}
function chart(p){const e=p.series,lo=Math.min(...e)-5,hi=Math.max(...e)+5,X=i=>40+i*(440/(e.length-1)),Y=v=>10+(hi-v)/(hi-lo)*130;
 let s=`<svg viewBox="0 0 500 170"><path d="M40 10V145H480" fill="none" stroke="#cfe3df" stroke-width="2"/>`;
 if(p.alarm_idx>=0)s+=`<line x1="${X(p.alarm_idx)}" x2="${X(p.alarm_idx)}" y1="10" y2="145" stroke="#e36414" stroke-dasharray="5 4"/><text x="${X(p.alarm_idx)+4}" y="22">CUSUM alarm</text>`;
 s+=`<polyline fill="none" stroke="#2a9d8f" stroke-dasharray="6 4" stroke-width="2" points="${p.fit.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/><polyline fill="none" stroke="#0f6b63" stroke-width="2.5" points="${e.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`;
 e.forEach((v,i)=>s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="#0f6b63"/><text x="${X(i)-8}" y="162">${p.months[i]}m</text>`);return s+"</svg>"}
async function open(id){cur=id;list();$("detail").textContent="Loading (the explanation may call an LLM)...";
 const p=await fetch("/api/members/"+id).then(r=>r.json()),mx=Math.max(...p.contributions.map(c=>Math.abs(c.value)),.1);
 $("detail").innerHTML=`<div style="display:flex;justify-content:space-between;flex-wrap:wrap"><h2>${esc(p.name)}, age ${p.age}</h2><b class="t-${p.tier}">${p.tier} risk, ${Math.round(p.risk*100)}% in 12 months</b></div>
 <p class="mut">eGFR ${Math.round(p.last)} (${p.stage}) | decline ${p.decline.toFixed(1)}/yr | DVI ${p.dvi} | UACR ${p.uacr} (${p.albuminuria})</p>${chart(p)}
 <h3>Why this score</h3>${p.contributions.slice(0,5).map(c=>`<div class="bar"><span>${esc(c.feature)}</span><i class="${c.value<0?"n":""}" style="width:${Math.max(3,Math.abs(c.value)/mx*100)}%"></i><b>${c.value>0?"+":""}${c.value.toFixed(2)}</b></div>`).join("")}
 <h3>Cited reason <span class="mut">(${p.explanation.mode}, route: ${p.explanation.route})</span></h3><div class="q">${esc(p.explanation.text)}</div>
 ${p.explanation.citations.map(c=>`<div class="mut">[${c.n}] ${esc(c.source)}: ${esc(c.text.slice(0,140))}...</div>`).join("")}
 <h3>Outreach draft</h3><div>${["en","te","hi"].map(l=>`<button data-l="${l}">${l.toUpperCase()}</button>`).join("")}</div><textarea id="msg"></textarea>
 <button class="go" id="ok" ${p.tier==="Low"?"disabled":""}>Approve and queue</button> <span class="mut" id="ms"></span>`;draft()}
async function draft(){const d=await api(`/members/${cur}/draft?lang=${lang}`,{});$("msg").value=d.text;$("ms").textContent="route: "+d.route}
async function drift(){const d=await fetch("/api/drift").then(r=>r.json());
 $("drift").innerHTML=`PSI <b>${d.psi.toFixed(2)}</b> (${d.status}), model v${d.model_version}<br><button id="rt" ${d.status==="drift"?"":"disabled"}>Retrain and register</button>`}
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.id)open(+b.dataset.id);else if(b.dataset.l){lang=b.dataset.l;draft()}
 else if(b.id==="ok"){await api(`/members/${cur}/approve`,{lang,text:$("msg").value});$("ms").textContent="approved and logged"}
 else if(b.id==="rt"){b.textContent="Retraining...";await api("/retrain",{});await boot()}});
boot().catch(e=>$("status").textContent="API error: "+e.message);
</script></body></html>
